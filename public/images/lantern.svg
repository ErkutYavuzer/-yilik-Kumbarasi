<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <!-- Paper body gradient — warm amber glow from internal flame -->
    <radialGradient id="paperGlow" cx="50%" cy="58%" r="48%" fx="50%" fy="62%">
      <stop offset="0%" stop-color="#FFFFF0" stop-opacity="0.97"/>
      <stop offset="10%" stop-color="#FFF8DC" stop-opacity="0.94"/>
      <stop offset="25%" stop-color="#FFE4A0" stop-opacity="0.88"/>
      <stop offset="42%" stop-color="#FFCC66" stop-opacity="0.80"/>
      <stop offset="58%" stop-color="#FFB040" stop-opacity="0.70"/>
      <stop offset="74%" stop-color="#F09030" stop-opacity="0.60"/>
      <stop offset="88%" stop-color="#D07020" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#A05018" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Top crown highlight — light catching the paper -->
    <radialGradient id="topHighlight" cx="42%" cy="24%" r="28%">
      <stop offset="0%" stop-color="#FFE8B0" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FFE8B0" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom rim bamboo gradient -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A07828"/>
      <stop offset="50%" stop-color="#6B4E14"/>
      <stop offset="100%" stop-color="#A07828"/>
    </linearGradient>

    <!-- Internal flame glow -->
    <radialGradient id="flameGlow" cx="50%" cy="75%" r="30%">
      <stop offset="0%" stop-color="#FFEE88" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFD050" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF8800" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== MAIN BARREL-SHAPED PAPER BODY ===== -->
  <!-- Profile: narrow gathered top → wide barrel middle → narrower bottom rim -->
  <path d="
    M 120 18
    C 92 18, 50 62, 32 118
    C 18 162, 16 195, 20 230
    C 24 258, 40 276, 58 288
    L 182 288
    C 200 276, 216 258, 220 230
    C 224 195, 222 162, 208 118
    C 190 62, 148 18, 120 18
    Z
  " fill="url(#paperGlow)"/>

  <!-- ===== INTERNAL FLAME GLOW (visible through paper) ===== -->
  <path d="
    M 120 18
    C 92 18, 50 62, 32 118
    C 18 162, 16 195, 20 230
    C 24 258, 40 276, 58 288
    L 182 288
    C 200 276, 216 258, 220 230
    C 224 195, 222 162, 208 118
    C 190 62, 148 18, 120 18
    Z
  " fill="url(#flameGlow)"/>

  <!-- ===== VISIBLE NERVURE LINES (structural bamboo ribs) ===== -->
  <!-- Center nervure -->
  <path d="M 120 18 C 120 80, 120 200, 120 288" stroke="rgba(140,70,15,0.14)" stroke-width="1.5" fill="none"/>
  <!-- Inner left nervure -->
  <path d="M 108 20 C 78 85, 56 170, 78 288" stroke="rgba(140,70,15,0.12)" stroke-width="1.3" fill="none"/>
  <!-- Inner right nervure -->
  <path d="M 132 20 C 162 85, 184 170, 162 288" stroke="rgba(140,70,15,0.12)" stroke-width="1.3" fill="none"/>
  <!-- Mid-left nervure -->
  <path d="M 98 26 C 55 95, 28 185, 62 288" stroke="rgba(140,70,15,0.10)" stroke-width="1.1" fill="none"/>
  <!-- Mid-right nervure -->
  <path d="M 142 26 C 185 95, 212 185, 178 288" stroke="rgba(140,70,15,0.10)" stroke-width="1.1" fill="none"/>
  <!-- Outer left nervure -->
  <path d="M 92 32 C 42 100, 20 195, 58 288" stroke="rgba(140,70,15,0.07)" stroke-width="0.9" fill="none"/>
  <!-- Outer right nervure -->
  <path d="M 148 32 C 198 100, 220 195, 182 288" stroke="rgba(140,70,15,0.07)" stroke-width="0.9" fill="none"/>

  <!-- ===== HORIZONTAL CRINKLE LINES (paper texture) ===== -->
  <line x1="38" y1="100" x2="202" y2="100" stroke="rgba(140,70,15,0.04)" stroke-width="0.6"/>
  <line x1="24" y1="155" x2="216" y2="155" stroke="rgba(140,70,15,0.035)" stroke-width="0.6"/>
  <line x1="18" y1="200" x2="222" y2="200" stroke="rgba(140,70,15,0.04)" stroke-width="0.6"/>
  <line x1="22" y1="245" x2="218" y2="245" stroke="rgba(140,70,15,0.035)" stroke-width="0.6"/>

  <!-- ===== TOP CROWN HIGHLIGHT ===== -->
  <path d="
    M 120 18
    C 92 18, 50 62, 32 118
    C 18 162, 16 195, 20 230
    C 24 258, 40 276, 58 288
    L 182 288
    C 200 276, 216 258, 220 230
    C 224 195, 222 162, 208 118
    C 190 62, 148 18, 120 18
    Z
  " fill="url(#topHighlight)"/>

  <!-- ===== LEFT EDGE SHADOW — 3D curvature ===== -->
  <path d="
    M 120 18
    C 92 18, 50 62, 32 118
    C 18 162, 16 195, 20 230
    C 22 248, 28 262, 40 274
    L 32 268
    C 22 254, 20 240, 22 220
    C 24 185, 30 145, 48 100
    C 68 52, 100 22, 120 18
    Z
  " fill="rgba(120,50,0,0.10)"/>

  <!-- ===== RIGHT EDGE SHADOW — 3D curvature ===== -->
  <path d="
    M 120 18
    C 148 18, 190 62, 208 118
    C 222 162, 224 195, 220 230
    C 218 248, 212 262, 200 274
    L 208 268
    C 218 254, 220 240, 218 220
    C 216 185, 210 145, 192 100
    C 172 52, 140 22, 120 18
    Z
  " fill="rgba(120,50,0,0.07)"/>

  <!-- ===== BOTTOM OPENING — dark mouth of the lantern ===== -->
  <ellipse cx="120" cy="290" rx="64" ry="13" fill="rgba(10,5,0,0.85)"/>

  <!-- ===== BAMBOO FRAME RING at bottom ===== -->
  <ellipse cx="120" cy="289" rx="66" ry="11" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>
  <!-- Bamboo ring highlight -->
  <ellipse cx="120" cy="289" rx="66" ry="11" fill="none" stroke="rgba(255,200,100,0.15)" stroke-width="1" stroke-dasharray="3,5"/>

  <!-- ===== CROSS-WIRE inside opening ===== -->
  <line x1="74" y1="289" x2="166" y2="289" stroke="rgba(100,70,30,0.5)" stroke-width="1.2"/>
  <line x1="120" y1="280" x2="120" y2="298" stroke="rgba(100,70,30,0.4)" stroke-width="1"/>
  <!-- Diagonal cross-wires -->
  <line x1="90" y1="282" x2="150" y2="296" stroke="rgba(100,70,30,0.2)" stroke-width="0.7"/>
  <line x1="150" y1="282" x2="90" y2="296" stroke="rgba(100,70,30,0.2)" stroke-width="0.7"/>

  <!-- ===== INNER GLOW visible through bottom opening ===== -->
  <ellipse cx="120" cy="286" rx="38" ry="7" fill="rgba(255,220,100,0.30)"/>
  <ellipse cx="120" cy="286" rx="20" ry="4" fill="rgba(255,240,180,0.20)"/>
</svg>
