<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyilik Kumbarası - Gösterim</title>
    <link rel="stylesheet" href="/css/themes.css?v=5.4.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        /* Match bars to sky blue of background image */
        html {
            background: #1B8FC4;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 4224px;
            height: 1536px;
            font-family: 'Nunito', sans-serif;
            /* Scale to fit actual screen */
            transform-origin: top left;
        }

        /* Main container */
        .display-container {
            width: 4224px;
            height: 1536px;
            position: relative;
            /* Arkaplan themes.css tarafindan yonetiliyor */
        }

        /* Background image covers entire viewport - no animation needed */

        /* Floating decorations removed - background image has lanterns and lights */
        .decorations,
        .shapes {
            display: none;
        }

        /* Header hidden - background image already contains branding */
        .display-header {
            display: none;
        }

        /* Wishes container - full screen, balloons float freely under header */
        #wishes-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #wishes-container.spotlight-mode .wish-card {
            opacity: 0.3;
            transition: opacity 0.5s, transform 0.5s;
        }

        #wishes-container.spotlight-mode .wish-card.spotlight-active {
            opacity: 1;
            position: absolute !important;
            top: 70% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.3) !important;
            z-index: 600 !important;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.6));
            animation: spotlightPulse 2s ease-in-out infinite;
        }

        @keyframes spotlightPulse {

            0%,
            100% {
                filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.6));
            }

            50% {
                filter: drop-shadow(0 0 60px rgba(255, 215, 0, 0.9));
            }
        }

        /* Balloon wish card */
        .wish-card {
            position: absolute;
            width: 520px;
            cursor: pointer;
            will-change: transform;
            /* Optimized GPU rendering */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .balloon-body {
            position: relative;
            width: 520px;
            height: 600px;
            background:
                radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 65% 75%, rgba(0, 0, 0, 0.15) 0%, transparent 50%),
                linear-gradient(160deg, var(--balloon-color) 0%, var(--balloon-color-dark, var(--balloon-color)) 100%);
            border-radius: 50% 50% 45% 45%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            /* Optimized for speed */
            overflow: hidden;
            transition: box-shadow 0.3s, transform 0.3s;
        }

        /* Primary glossy shine - bright reflection */
        .balloon-body::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 15%;
            width: 40%;
            height: 35%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            transform: rotate(-20deg);
            pointer-events: none;
        }

        /* Balloon knot */
        .balloon-body::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: var(--balloon-color, #FF6B6B);
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
            filter: brightness(0.85);
        }

        /* Balloon string - wavy */
        .balloon-string {
            width: 3px;
            height: 120px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.05));
            margin-top: -1px;
            position: relative;
            animation: stringWave 3s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes stringWave {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(2deg);
            }

            75% {
                transform: rotate(-2deg);
            }
        }

        .balloon-string::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
        }

        .wish-card:hover {
            z-index: 100;
        }

        .wish-card:hover .balloon-body {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            /* Optimized for speed */
            transform: scale(1.05);
        }

        /* ═══ DİLEK FENERİ (WISH LANTERN) MODE ═══ */

        .wish-card.lantern-mode {
            width: 520px;
            filter: drop-shadow(0 0 40px rgba(255, 150, 0, 0.25));
        }

        /* Lantern body - dome shaped paper lantern with ribs */
        .lantern-body {
            position: relative;
            width: 290px;
            height: 360px;
            margin: 0 auto;
            background:
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    transparent 36px,
                    rgba(200, 120, 20, 0.12) 36px,
                    rgba(200, 120, 20, 0.12) 38px
                ),
                radial-gradient(ellipse at 50% 35%,
                    rgba(255, 245, 200, 0.98) 0%,
                    rgba(255, 210, 100, 0.95) 20%,
                    rgba(255, 175, 50, 0.92) 40%,
                    rgba(230, 130, 20, 0.88) 65%,
                    rgba(200, 90, 10, 0.85) 100%);
            border-radius: 50% 50% 18% 18% / 60% 60% 22% 22%;
            box-shadow:
                0 0 50px rgba(255, 165, 0, 0.5),
                0 0 100px rgba(255, 120, 0, 0.25),
                0 0 200px rgba(255, 80, 0, 0.1),
                inset 0 20px 50px rgba(255, 255, 200, 0.35),
                inset 0 -30px 40px rgba(180, 70, 0, 0.25);
            overflow: visible;
            transition: box-shadow 0.4s ease, filter 0.4s ease;
        }

        /* Inner warm glow + paper grain texture */
        .lantern-body::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 70%;
            height: 60%;
            background:
                radial-gradient(ellipse at 50% 45%,
                    rgba(255, 255, 230, 0.8) 0%,
                    rgba(255, 230, 120, 0.4) 35%,
                    rgba(255, 200, 50, 0.15) 60%,
                    transparent 80%);
            border-radius: 50%;
            animation: lanternGlow 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        /* Top wooden frame/ring with 3D depth */
        .lantern-body::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 22px;
            background: linear-gradient(180deg,
                #C4813A 0%, #A0622D 25%, #8B4513 50%, #6B3410 75%, #8B4513 100%);
            border-radius: 6px 6px 3px 3px;
            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.4),
                inset 0 2px 4px rgba(255, 200, 120, 0.3),
                inset 0 -2px 3px rgba(0, 0, 0, 0.2);
            z-index: 5;
        }

        /* Flame - centered inside lantern with glow ring */
        .lantern-flame {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 46px;
            height: 70px;
            background:
                radial-gradient(ellipse at 50% 60%,
                    #FFFFF0 0%,
                    #FFFDE0 15%,
                    #FFD700 30%,
                    #FFA500 50%,
                    #FF6600 70%,
                    transparent 100%);
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            animation: flameFlicker 2s ease-in-out infinite;
            filter: blur(1.5px);
            z-index: 3;
        }

        /* Flame secondary glow ring */
        .lantern-flame::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 115px;
            height: 115px;
            background: radial-gradient(circle,
                rgba(255, 220, 100, 0.3) 0%,
                rgba(255, 165, 0, 0.15) 40%,
                transparent 70%);
            border-radius: 50%;
            animation: lanternGlow 3s ease-in-out infinite reverse;
            pointer-events: none;
        }

        /* String connecting lantern to parchment */
        .lantern-string {
            width: 2px;
            height: 55px;
            background: linear-gradient(to bottom,
                #6B3A10 0%, #A0724A 30%, #D2B48C 50%, #A0724A 70%, #6B3A10 100%);
            margin: 0 auto;
            position: relative;
            animation: stringWave 5s ease-in-out infinite;
            transform-origin: top center;
            box-shadow: 1px 0 3px rgba(0, 0, 0, 0.15);
        }

        /* Parchment/Scroll - aged parşömen with 3D curls */
        .lantern-parchment {
            position: relative;
            width: 360px;
            min-height: 90px;
            max-height: 320px;
            margin: 0 auto;
            padding: 50px 36px 45px;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 30px,
                    rgba(139, 69, 19, 0.04) 30px,
                    rgba(139, 69, 19, 0.04) 32px
                ),
                linear-gradient(90deg,
                    rgba(139, 69, 19, 0.08) 0%,
                    transparent 8%,
                    transparent 92%,
                    rgba(139, 69, 19, 0.08) 100%),
                linear-gradient(180deg,
                    #F5E6C8 0%, #F2E0B8 10%, #ECD9A8 30%,
                    #E8D4A0 50%,
                    #ECD9A8 70%, #F2E0B8 90%, #F5E6C8 100%);
            border-radius: 4px;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(139, 69, 19, 0.06),
                inset 3px 0 10px rgba(139, 69, 19, 0.04),
                inset -3px 0 10px rgba(139, 69, 19, 0.04);
            border: 1px solid rgba(139, 69, 19, 0.12);
            overflow: hidden;
        }

        /* Top scroll curl - pronounced 3D roll with depth */
        .lantern-parchment::before {
            content: '';
            position: absolute;
            top: -27px;
            left: 2%;
            right: 2%;
            height: 55px;
            background: linear-gradient(to bottom,
                    #B8975A 0%,
                    #C4A56A 10%,
                    #D4BC82 25%,
                    #DEC896 40%,
                    #E8D5A8 55%,
                    #EFDDBa 70%,
                    #F2E0B8 85%,
                    #F5E6C8 100%);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            box-shadow:
                0 -3px 8px rgba(0, 0, 0, 0.15),
                0 6px 12px rgba(0, 0, 0, 0.1),
                inset 0 -12px 18px rgba(139, 69, 19, 0.12),
                inset 0 4px 6px rgba(255, 255, 240, 0.15);
            border: 1px solid rgba(139, 69, 19, 0.15);
            border-bottom: none;
            z-index: 1;
        }

        /* Bottom scroll curl - pronounced 3D roll with depth */
        .lantern-parchment::after {
            content: '';
            position: absolute;
            bottom: -27px;
            left: 2%;
            right: 2%;
            height: 55px;
            background: linear-gradient(to top,
                    #B8975A 0%,
                    #C4A56A 10%,
                    #D4BC82 25%,
                    #DEC896 40%,
                    #E8D5A8 55%,
                    #EFDDBa 70%,
                    #F2E0B8 85%,
                    #F5E6C8 100%);
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.15),
                0 -6px 12px rgba(0, 0, 0, 0.1),
                inset 0 12px 18px rgba(139, 69, 19, 0.12),
                inset 0 -4px 6px rgba(255, 255, 240, 0.15);
            border: 1px solid rgba(139, 69, 19, 0.15);
            border-top: none;
            z-index: 1;
        }

        /* Parchment text overrides */
        .wish-card.lantern-mode .wish-text {
            position: relative;
            top: auto;
            left: auto;
            transform: none;
            width: auto;
            max-height: none;
            padding: 0;
            font-size: 22px;
            font-weight: 600;
            color: #3D2400;
            text-shadow: 0 1px 1px rgba(139, 69, 19, 0.08);
            font-style: italic;
            font-family: 'Georgia', 'Palatino Linotype', 'Book Antiqua', serif;
            line-height: 1.35;
            text-align: center;
            overflow: hidden;
            z-index: 2;
        }

        .wish-card.lantern-mode .child-name {
            position: relative;
            bottom: auto;
            left: auto;
            transform: none;
            width: auto;
            max-width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            font-size: 20px;
            font-weight: 800;
            color: #5A2D0C;
            text-shadow: none;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(139, 69, 19, 0.15);
            text-align: center;
            font-family: 'Nunito', sans-serif;
            z-index: 2;
        }

        /* Decorative separator before child name */
        .wish-card.lantern-mode .child-name::before {
            content: '✦';
            display: block;
            font-size: 12px;
            color: rgba(139, 69, 19, 0.3);
            margin-bottom: 4px;
            letter-spacing: 8px;
            text-indent: 8px;
        }

        @keyframes lanternGlow {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            30% { opacity: 0.95; transform: scale(1.08); }
            50% { opacity: 0.7; transform: scale(1.02); }
            70% { opacity: 1; transform: scale(1.06); }
        }

        @keyframes flameFlicker {
            0%   { transform: translate(-50%, -50%) scaleY(1) scaleX(1) rotate(0deg); opacity: 0.85; }
            15%  { transform: translate(-50%, -50%) scaleY(1.15) scaleX(0.85) rotate(-1deg); opacity: 1; }
            30%  { transform: translate(-50%, -50%) scaleY(0.9) scaleX(1.1) rotate(1deg); opacity: 0.9; }
            50%  { transform: translate(-50%, -50%) scaleY(1.1) scaleX(0.9) rotate(-0.5deg); opacity: 0.95; }
            70%  { transform: translate(-50%, -50%) scaleY(0.95) scaleX(1.05) rotate(0.5deg); opacity: 0.88; }
            85%  { transform: translate(-50%, -50%) scaleY(1.08) scaleX(0.92) rotate(-1deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scaleY(1) scaleX(1) rotate(0deg); opacity: 0.85; }
        }

        /* Fener giriş animasyonu JS tarafından yönetiliyor (fade-in + sinüs salınımı) */
        .wish-card.lantern-mode.entering {
            /* CSS animasyonu yok — JS opacity ve transform ile hallediliyor */
        }

        .wish-card.lantern-mode:hover .lantern-body {
            box-shadow:
                0 0 70px rgba(255, 180, 30, 0.8),
                0 0 140px rgba(255, 120, 0, 0.4),
                0 0 250px rgba(255, 80, 0, 0.15),
                inset 0 20px 50px rgba(255, 255, 200, 0.45);
            filter: brightness(1.1);
        }
        /* Collision bounce animation removed */

        /* The exaggerated margin-top floating bob animation was removed for performance */

        .wish-card.entering {
            animation: balloonPop 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes balloonPop {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(0)
            }

            60% {
                transform: translateY(-20px) scale(1.1)
            }

            80% {
                transform: translateY(5px) scale(0.95)
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }

        .wish-card .wish-text {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.4),
                0 4px 10px rgba(0, 0, 0, 0.3);
            line-height: 1.3;
            word-break: break-word;
            overflow-wrap: break-word;
            width: 380px;
            max-height: 320px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 8;
            line-clamp: 8;
            -webkit-box-orient: vertical;
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            padding: 0 10px;
        }

        .wish-card .child-name {
            text-align: center;
            padding: 0 20px;
            font-size: 24px;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            line-height: 1.2;
            width: 75%;
            max-width: 380px;

            /* Taşmaları alt satıra geçirme ve max 2 satırda (clamp) kesme */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        /* Empty state */
        #empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 50;
        }

        .empty-icon {
            font-size: 200px;
            animation: emptyPulse 3s ease-in-out infinite;
        }

        @keyframes emptyPulse {

            0%,
            100% {
                transform: scale(1) rotate(0)
            }

            25% {
                transform: scale(1.1) rotate(-5deg)
            }

            75% {
                transform: scale(1.1) rotate(5deg)
            }
        }

        .empty-text {
            font-size: 72px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 16px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .empty-sub {
            font-size: 36px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }

        /* Counter */
        .counter {
            position: absolute;
            bottom: 50px;
            right: 50px;
            z-index: 200;
            background: white;
            border-radius: 30px;
            padding: 24px 48px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 40px;
            font-weight: 800;
            color: #333;
        }

        .counter .counter-icon {
            font-size: 48px
        }

        /* Spotlight overlay - arka plan hafif karanlik */
        #spotlight-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 4224px;
            height: 1536px;
            background: rgba(0, 0, 0, 0.3);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #spotlight-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Spotlight isim etiketi */
        #spotlight-label {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            z-index: 700;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a35;
            padding: 28px 70px;
            border-radius: 40px;
            font-size: 52px;
            font-weight: 900;
            box-shadow: 0 8px 30px rgba(255, 165, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #spotlight-label.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* New wish notification */
        .new-wish-toast {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-200px);
            background: white;
            border-radius: 30px;
            padding: 24px 48px;
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.15);
            z-index: 300;
            font-size: 40px;
            font-weight: 800;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .new-wish-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Fullscreen button */
        .fullscreen-btn {
            position: absolute;
            bottom: 50px;
            left: 50px;
            z-index: 200;
            width: 90px;
            height: 90px;
            background: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        /* Mute button */
        .mute-btn {
            position: absolute;
            bottom: 50px;
            left: 160px;
            z-index: 200;
            width: 90px;
            height: 90px;
            background: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .mute-btn:hover {
            transform: scale(1.1);
        }

        .mute-btn.muted {
            opacity: 0.5;
        }

        /* Display confetti */
        .display-confetti {
            position: absolute;
            z-index: 10002;
            pointer-events: none;
            animation: displayConfettiFall 3.5s ease-out forwards;
        }

        .display-confetti.side-left {
            animation: confettiFromLeft 3s ease-out forwards;
        }
        .display-confetti.side-right {
            animation: confettiFromRight 3s ease-out forwards;
        }

        @keyframes displayConfettiFall {
            0% {
                transform: translateY(-40px) rotate(0) scale(1);
                opacity: 1;
            }
            80% { opacity: 1; }
            100% {
                transform: translateY(1700px) rotate(1080deg) scale(0.5);
                opacity: 0;
            }
        }

        @keyframes confettiFromLeft {
            0% {
                transform: translate(-100px, 768px) rotate(0) scale(1);
                opacity: 1;
            }
            80% { opacity: 1; }
            100% {
                transform: translate(2500px, 460px) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        @keyframes confettiFromRight {
            0% {
                transform: translate(100px, 768px) rotate(0) scale(1);
                opacity: 1;
            }
            80% { opacity: 1; }
            100% {
                transform: translate(-2500px, 460px) rotate(-720deg) scale(0.3);
                opacity: 0;
            }
        }

        @keyframes sparkleExplode {
            0% {
                opacity: 0;
                transform: scale(0) translate(0, 0);
            }
            20% {
                opacity: 1;
                transform: scale(1.5);
            }
            100% {
                opacity: 0;
                transform: scale(0.5) translate(
                    calc((var(--rx, 0.5) - 0.5) * 1200px),
                    calc((var(--ry, 0.5) - 0.5) * 900px)
                );
            }
        }

        /* Emoji rain */
        .celebration-emoji {
            position: absolute;
            z-index: 10002;
            pointer-events: none;
            font-size: 60px;
            animation: emojiFloat 4s ease-out forwards;
        }

        @keyframes emojiFloat {
            0% {
                transform: translateY(-80px) rotate(0) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 1; transform: translateY(0) rotate(10deg) scale(1); }
            50% { transform: translateY(600px) rotate(-15deg) scale(1.1); opacity: 1; }
            100% {
                transform: translateY(1600px) rotate(30deg) scale(0.6);
                opacity: 0;
            }
        }

        /* Firework starburst */
        .firework-ray {
            position: absolute;
            z-index: 10002;
            pointer-events: none;
            width: 4px;
            border-radius: 2px;
            animation: fireworkRay 1.5s ease-out forwards;
            transform-origin: bottom center;
        }

        @keyframes fireworkRay {
            0% {
                height: 0;
                opacity: 1;
            }
            40% {
                height: 120px;
                opacity: 1;
            }
            100% {
                height: 120px;
                opacity: 0;
                transform: translateY(-60px) scaleY(0.3);
            }
        }

        /* Winner reveal flash */
        .reveal-flash {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            z-index: 10003;
            pointer-events: none;
            animation: flashBang 0.6s ease-out forwards;
        }

        @keyframes flashBang {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        /* Raffle box golden pulse on reveal */
        #raffle-overlay.show .raffle-box.celebrating {
            animation: borderPulseGold 1s ease-in-out 3;
        }

        @keyframes borderPulseGold {
            0%, 100% {
                box-shadow: 0 30px 100px rgba(0,0,0,0.5), inset 0 0 50px rgba(255,255,255,0.1), 0 0 40px rgba(255,215,0,0.3);
                border-color: rgba(255,255,255,0.2);
            }
            50% {
                box-shadow: 0 30px 100px rgba(0,0,0,0.5), inset 0 0 50px rgba(255,255,255,0.1), 0 0 100px rgba(255,215,0,0.8), 0 0 200px rgba(255,165,0,0.4);
                border-color: rgba(255,215,0,0.8);
            }
        }

        #raffle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 4224px;
            height: 1536px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #raffle-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .raffle-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 60px 100px;
            text-align: center;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5), inset 0 0 50px rgba(255, 255, 255, 0.1);
            transform: scale(0.8) translateY(100px);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 80%;
        }

        #raffle-overlay.show .raffle-box {
            transform: scale(1) translateY(0);
        }

        .raffle-title {
            font-size: 80px;
            font-weight: 900;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 50px;
            text-shadow: 0 10px 30px rgba(255, 215, 0, 0.4), 0 2px 5px rgba(0, 0, 0, 0.8);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                text-shadow: 0 10px 30px rgba(255, 215, 0, 0.4), 0 2px 5px rgba(0, 0, 0, 0.8);
            }

            50% {
                text-shadow: 0 10px 60px rgba(255, 215, 0, 0.8), 0 2px 5px rgba(0, 0, 0, 0.8);
            }
        }

        .raffle-winners-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
        }

        .raffle-item {
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 30px 50px;
            font-size: 50px;
            font-weight: 800;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .raffle-item.reveal {
            opacity: 1;
            transform: scale(1);
        }

        /* Professional overlay: 2D gradient mask — center logo area ONLY */
        /* Side logos and decorative lanterns stay unmasked; only center text/logo covered */
        .logo-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            background: inherit;

            /* Radial ellipse sized for 4224px canvas — covers center logo/text only */
            -webkit-mask-image: radial-gradient(ellipse 1800px 800px at 50% 0%, black 0%, black 60%, transparent 95%);
            mask-image: radial-gradient(ellipse 1800px 800px at 50% 0%, black 0%, black 60%, transparent 95%);
        }
    </style>
</head>

<body>

    <div class="display-container">
        <!-- Floating shapes -->
        <div class="shapes" id="shapes"></div>

        <!-- Decorations -->
        <div class="decorations" id="decorations"></div>

        <!-- Header -->
        <div class="display-header">
            <div class="display-title">
                <span class="title-icon">&#x1F3FA;</span>
                <img class="title-logo" src="/images/tt.png" alt="Türk Telekom" />
                <span class="title-text">Dilek Kumbarasi</span>
                <span class="title-subtitle"></span>
            </div>
        </div>

        <!-- Wishes float here -->
        <div id="wishes-container"></div>

        <!-- Logo layer: renders ON TOP of wishes so lanterns pass BEHIND logos -->
        <div class="logo-layer"></div>

        <!-- Empty state -->
        <div id="empty-state">
            <div class="empty-icon">&#x2728;</div>
            <div class="empty-text">Dilekler Bekleniyor...</div>
            <div class="empty-sub">Ilk dilek yazildiginda burada gorunecek</div>
        </div>
        <!-- Raffle (Çekiliş) Overlay -->
        <div id="raffle-overlay">
            <div class="raffle-box">
                <div class="raffle-title">🎁 ŞANSLI KALPLER 🎁</div>
                <div class="raffle-winners-container" id="raffle-winners-container">
                    <!-- Javascript will inject winners here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Spotlight -->
    <div id="spotlight-overlay"></div>
    <div id="spotlight-label">🌟 <span id="spotlight-name"></span></div>

    <!-- Controls -->
    <button class="fullscreen-btn" id="fullscreen-btn" title="Tam Ekran">&#x26F6;</button>
    <button class="mute-btn" id="mute-btn" title="Ses Aç/Kapa">🔊</button>

    <!-- Counter -->
    <div class="counter">
        <span class="counter-icon">&#x2728;</span>
        <span id="counter-number">0</span> Dilek
    </div>

    <!-- New wish toast -->
    <div class="new-wish-toast" id="new-wish-toast">
        &#x1F389; Yeni Dilek Geldi!
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Auto-scale 4224x1536 canvas to cover actual screen without gaps
        const DESIGN_WIDTH = 4224;
        const DESIGN_HEIGHT = 1536;

        function scaleToFit() {
            const scaleX = window.innerWidth / DESIGN_WIDTH;
            const scaleY = window.innerHeight / DESIGN_HEIGHT;
            // Stretch X and Y independently. 
            // This guarantees absolutely 0 letterboxing and 0 cropping (perfect for LED hardware mapping)
            document.body.style.transform = `scale(${scaleX}, ${scaleY})`;
            document.body.style.transformOrigin = 'top left';
            // Since it stretches perfectly, no margin offsets are needed
            document.body.style.marginLeft = '0px';
            document.body.style.marginTop = '0px';
        }

        scaleToFit();
        window.addEventListener('resize', scaleToFit);
    </script>
    <script src="js/display.js?v=5.3.0"></script>
</body>

</html>
