<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyilik Kumbarası - Gösterim</title>
    <link rel="stylesheet" href="/css/themes.css?v=4.0.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        /* Match bars to sky blue of background image */
        html {
            background: #1B8FC4;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 4224px;
            height: 1536px;
            font-family: 'Nunito', sans-serif;
            /* Scale to fit actual screen */
            transform-origin: top left;
        }

        /* Main container */
        .display-container {
            width: 4224px;
            height: 1536px;
            position: relative;
            /* Arkaplan themes.css tarafindan yonetiliyor */
        }

        /* Background image covers entire viewport - no animation needed */

        /* Floating decorations removed - background image has lanterns and lights */
        .decorations,
        .shapes {
            display: none;
        }

        /* Header hidden - background image already contains branding */
        .display-header {
            display: none;
        }

        /* Wishes container - positioned below the header area of background */
        #wishes-container {
            position: absolute;
            top: 25%;
            left: 5%;
            width: 90%;
            height: 60%;
            z-index: 10;
        }

        #wishes-container.spotlight-mode .wish-card {
            opacity: 0.3;
            transition: opacity 0.5s, transform 0.5s;
        }

        #wishes-container.spotlight-mode .wish-card.spotlight-active {
            opacity: 1;
            position: absolute !important;
            top: 70% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.3) !important;
            z-index: 600 !important;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.6));
            animation: spotlightPulse 2s ease-in-out infinite;
        }

        @keyframes spotlightPulse {

            0%,
            100% {
                filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.6));
            }

            50% {
                filter: drop-shadow(0 0 60px rgba(255, 215, 0, 0.9));
            }
        }

        /* Balloon wish card */
        .wish-card {
            position: absolute;
            width: 520px;
            cursor: pointer;
            will-change: transform;
            /* Optimized GPU rendering */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .balloon-body {
            position: relative;
            width: 520px;
            height: 600px;
            background:
                radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 65% 75%, rgba(0, 0, 0, 0.15) 0%, transparent 50%),
                linear-gradient(160deg, var(--balloon-color) 0%, var(--balloon-color-dark, var(--balloon-color)) 100%);
            border-radius: 50% 50% 45% 45%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            /* Optimized for speed */
            overflow: hidden;
            transition: box-shadow 0.3s, transform 0.3s;
        }

        /* Primary glossy shine - bright reflection */
        .balloon-body::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 15%;
            width: 40%;
            height: 35%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            transform: rotate(-20deg);
            pointer-events: none;
        }

        /* Balloon knot */
        .balloon-body::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: var(--balloon-color, #FF6B6B);
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
            filter: brightness(0.85);
        }

        /* Balloon string - wavy */
        .balloon-string {
            width: 3px;
            height: 120px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.05));
            margin-top: -1px;
            position: relative;
            animation: stringWave 3s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes stringWave {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(2deg);
            }

            75% {
                transform: rotate(-2deg);
            }
        }

        .balloon-string::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
        }

        .wish-card:hover {
            z-index: 100;
        }

        .wish-card:hover .balloon-body {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            /* Optimized for speed */
            transform: scale(1.05);
        }

        /* Collision bounce animation removed */

        /* The exaggerated margin-top floating bob animation was removed for performance */

        .wish-card.entering {
            animation: balloonPop 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes balloonPop {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(0)
            }

            60% {
                transform: translateY(-20px) scale(1.1)
            }

            80% {
                transform: translateY(5px) scale(0.95)
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }

        .wish-card .wish-text {
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.4),
                0 4px 10px rgba(0, 0, 0, 0.3);
            line-height: 1.4;
            word-break: break-word;
            overflow-wrap: break-word;
            width: 410px;
            /* Kenarlardan daha fazla pay bırakmak için 440'tan 410'a daraltıldı */
            max-height: 440px;
            overflow: hidden;
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            padding: 0 10px;
        }

        .wish-card .child-name {
            text-align: center;
            padding: 0 16px;
            font-size: 28px;
            /* Dar alana iki satır sığdırmak için 32'den 28'e indirildi */
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            line-height: 1.2;
            width: 65%;
            /* Alt düğüm kısmı ovalleştiği için %80'den %65'e daraltıldı */
            max-width: 340px;

            /* Taşmaları alt satıra geçirme ve max 2 satırda (clamp) kesme */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        /* Empty state */
        #empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 50;
        }

        .empty-icon {
            font-size: 200px;
            animation: emptyPulse 3s ease-in-out infinite;
        }

        @keyframes emptyPulse {

            0%,
            100% {
                transform: scale(1) rotate(0)
            }

            25% {
                transform: scale(1.1) rotate(-5deg)
            }

            75% {
                transform: scale(1.1) rotate(5deg)
            }
        }

        .empty-text {
            font-size: 72px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 16px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .empty-sub {
            font-size: 36px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }

        /* Counter */
        .counter {
            position: absolute;
            bottom: 50px;
            right: 50px;
            z-index: 200;
            background: white;
            border-radius: 30px;
            padding: 24px 48px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 40px;
            font-weight: 800;
            color: #333;
        }

        .counter .counter-icon {
            font-size: 48px
        }

        /* Spotlight overlay - arka plan hafif karanlik */
        #spotlight-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 4224px;
            height: 1536px;
            background: rgba(0, 0, 0, 0.3);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #spotlight-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Spotlight isim etiketi */
        #spotlight-label {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            z-index: 700;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a35;
            padding: 28px 70px;
            border-radius: 40px;
            font-size: 52px;
            font-weight: 900;
            box-shadow: 0 8px 30px rgba(255, 165, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #spotlight-label.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* New wish notification */
        .new-wish-toast {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-200px);
            background: white;
            border-radius: 30px;
            padding: 24px 48px;
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.15);
            z-index: 300;
            font-size: 40px;
            font-weight: 800;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .new-wish-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Fullscreen button */
        .fullscreen-btn {
            position: absolute;
            bottom: 50px;
            left: 50px;
            z-index: 200;
            width: 90px;
            height: 90px;
            background: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        /* Mute button */
        .mute-btn {
            position: absolute;
            bottom: 50px;
            left: 160px;
            z-index: 200;
            width: 90px;
            height: 90px;
            background: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .mute-btn:hover {
            transform: scale(1.1);
        }

        .mute-btn.muted {
            opacity: 0.5;
        }

        /* Display confetti */
        .display-confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            z-index: 300;
            pointer-events: none;
            animation: displayConfettiFall 3s ease-out forwards;
        }

        @keyframes displayConfettiFall {
            0% {
                transform: translateY(-20px) rotate(0);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(900deg);
                opacity: 0;
            }
        }

        #raffle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 4224px;
            height: 1536px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #raffle-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .raffle-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 60px 100px;
            text-align: center;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5), inset 0 0 50px rgba(255, 255, 255, 0.1);
            transform: scale(0.8) translateY(100px);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 80%;
        }

        #raffle-overlay.show .raffle-box {
            transform: scale(1) translateY(0);
        }

        .raffle-title {
            font-size: 80px;
            font-weight: 900;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 50px;
            text-shadow: 0 10px 30px rgba(255, 215, 0, 0.4), 0 2px 5px rgba(0, 0, 0, 0.8);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                text-shadow: 0 10px 30px rgba(255, 215, 0, 0.4), 0 2px 5px rgba(0, 0, 0, 0.8);
            }

            50% {
                text-shadow: 0 10px 60px rgba(255, 215, 0, 0.8), 0 2px 5px rgba(0, 0, 0, 0.8);
            }
        }

        .raffle-winners-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
        }

        .raffle-item {
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 30px 50px;
            font-size: 50px;
            font-weight: 800;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .raffle-item.reveal {
            opacity: 1;
            transform: scale(1);
        }

        /* Modern CSS pseudo-3D parallax overlay trick */
        .logo-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            background: inherit;

            /* Complex polygon that only masks the specific logos:
               1. Top-Left Logo (0 to 450px X, 0 to 450px Y)
               2. Center Logo (1300px to 2900px X, 0 to 500px Y)
               3. Top-Right Logo (3700px to 4224px X, 0 to 450px Y)
               It traces the top edge, drops down to frame each logo, and goes back up. */
            clip-path: polygon(
                    /* Start top left */
                    0 0,

                    /* Left Logo */
                    0 450px, 450px 450px, 450px 0,

                    /* Gap to Center */
                    1300px 0,

                    /* Center Logo */
                    1300px 500px, 2900px 500px, 2900px 0,

                    /* Gap to Right */
                    3700px 0,

                    /* Right Logo */
                    3700px 450px, 100% 450px, 100% 0);
        }
    </style>
</head>

<body>

    <div class="display-container">
        <!-- Floating shapes -->
        <div class="shapes" id="shapes"></div>

        <!-- Decorations -->
        <div class="decorations" id="decorations"></div>

        <!-- Header -->
        <div class="display-header">
            <div class="display-title">
                <span class="title-icon">&#x1F3FA;</span>
                <span class="title-text">Dilek Kumbarasi</span>
            </div>
        </div>

        <!-- Wishes float here -->
        <div id="wishes-container"></div>

        <!-- Empty state -->
        <div id="empty-state">
            <div class="empty-icon">&#x2728;</div>
            <div class="empty-text">Dilekler Bekleniyor...</div>
            <div class="empty-sub">Ilk dilek yazildiginda burada gorunecek</div>
        </div>
        <!-- Raffle (Çekiliş) Overlay -->
        <div id="raffle-overlay">
            <div class="raffle-box">
                <div class="raffle-title">🎁 ŞANSLI KALPLER 🎁</div>
                <div class="raffle-winners-container" id="raffle-winners-container">
                    <!-- Javascript will inject winners here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Spotlight -->
    <div id="spotlight-overlay"></div>
    <div id="spotlight-label">🌟 <span id="spotlight-name"></span></div>

    <!-- Controls -->
    <button class="fullscreen-btn" id="fullscreen-btn" title="Tam Ekran">&#x26F6;</button>
    <button class="mute-btn" id="mute-btn" title="Ses Aç/Kapa">🔊</button>

    <!-- Counter -->
    <div class="counter">
        <span class="counter-icon">&#x2728;</span>
        <span id="counter-number">0</span> Dilek
    </div>

    <!-- New wish toast -->
    <div class="new-wish-toast" id="new-wish-toast">
        &#x1F389; Yeni Dilek Geldi!
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Auto-scale 4224x1536 canvas to cover actual screen without gaps
        const DESIGN_WIDTH = 4224;
        const DESIGN_HEIGHT = 1536;

        function scaleToFit() {
            const scaleX = window.innerWidth / DESIGN_WIDTH;
            const scaleY = window.innerHeight / DESIGN_HEIGHT;
            // Stretch X and Y independently. 
            // This guarantees absolutely 0 letterboxing and 0 cropping (perfect for LED hardware mapping)
            document.body.style.transform = `scale(${scaleX}, ${scaleY})`;
            document.body.style.transformOrigin = 'top left';
            // Since it stretches perfectly, no margin offsets are needed
            document.body.style.marginLeft = '0px';
            document.body.style.marginTop = '0px';
        }

        scaleToFit();
        window.addEventListener('resize', scaleToFit);
    </script>
    <script src="js/display.js?v=4.0.0"></script>
</body>

</html>
