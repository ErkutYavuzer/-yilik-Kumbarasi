apiVersion: apps/v1
kind: Deployment
metadata:
  name: dilek-kumbarasi-beta
  namespace: dilek-kumbarasi-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dilek-kumbarasi-beta
  template:
    metadata:
      labels:
        app: dilek-kumbarasi-beta
    spec:
      containers:
        - name: dilek-kumbarasi-beta
          image: ghcr.io/ayavuzer/dilek-kumbarasi:beta-qr-stage-scale-20260511-1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: MINIMAX_BASE_URL
              value: https://api.minimax.io/v1
            - name: MINIMAX_API_KEY
              value: sk-cp-2Bm3hS5X6BGL4pxhFogHohbX00TK10T7JD5J9BF4-Oqge0jZj7r5WHL9x0x1V_u1GNZU3s0ofHbUe1mwWH3d2nWFdQ31CYKF-n_zMG7CsCkhVlju9I5QHmA
            - name: MINIMAX_TEXT_MODEL
              value: MiniMax-M2.7
            - name: ANTIGRAVITY_BASE_URL
              value: https://antigravity2.mindops.net/v1
            - name: ANTIGRAVITY_API_KEY
              value: sk-antigravity-lejyon-2026
            - name: PUBLIC_DOMAIN
              value: https://dilek-kumbarasi-beta.mindops.net
          volumeMounts:
            - mountPath: /app/uploads
              name: dilek-storage
              subPath: uploads
            - mountPath: /app/data
              name: dilek-storage
              subPath: data
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: dilek-storage
          persistentVolumeClaim:
            claimName: dilek-kumbarasi-beta-pvc
